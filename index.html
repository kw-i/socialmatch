<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialMatch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside id="panel">
  <h1>SocialMatch</h1>
  <p class="sub">Pick your moods, then narrow the map by color and activity.</p>

  <section>
    <h2>Your moods <small>(pick any)</small></h2>
    <div id="moods" class="chips"></div>
  </section>

  <section>
    <h2>Colors to show <small>(none selected = all)</small></h2>
    <div id="levels" class="levels"></div>
  </section>

  <section>
    <h2>Activity types <small>(none selected = all)</small></h2>
    <div id="cats" class="chips"></div>
    <label class="check"><input id="fEvents" type="checkbox" checked> Show events</label>
    <button id="reset" class="link">Reset filters</button>
  </section>

  <section id="route" hidden>
    <h2>Directions to <span id="rName"></span></h2>
    <p id="rSum"></p>
    <a id="rGoogle" target="_blank" rel="noopener">Open in Google Maps</a>
    <button id="rClear" class="link">Clear route</button>
    <ol id="rSteps"></ol>
  </section>

  <section>
    <h2 id="resHead">Places</h2>
    <ol id="results"></ol>
    <h2 id="evHead">Upcoming events</h2>
    <ul id="events"></ul>
  </section>
  <p id="status" role="status"></p>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/algorithms.js"></script>
<script src="js/db.js"></script>
<script src="js/map.js"></script>
<script src="js/directions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
